spring:
  application:
    name: kamikatsu-api
  
  datasource:
    url: jdbc:postgresql://localhost:5432/kamikatsu
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        search:
          backend:
            type: elasticsearch
            hosts: localhost:9200
            discovery:
              enabled: false

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.kamikatsu: DEBUG

gemini:
  api:
    key: ${GEMINI_API_KEY:}
